:root{--bg:#0d0b10;--panel:#17131c;--ink:#efe8f4;--dim:#9b90a6;--acc:#c6f36b;--acc2:#e58bff;--line:#2b2433}

html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "JetBrains Mono",ui-monospace,monospace;
 background-image:radial-gradient(1200px 600px at 10% -10%,#2a1838 0,transparent 60%),radial-gradient(900px 500px at 110% 0,#183220 0,transparent 55%);background-attachment:fixed}
header{padding:56px 24px 20px;max-width:1500px;margin:0 auto}

.sub{color:var(--dim);margin:14px 0 0}
.bar{position:sticky;top:0;z-index:10;background:rgba(13,11,16,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1500px;margin:0 auto;padding:12px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 240px;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:999px;font:inherit;outline:none}
input[type=search]:focus{border-color:var(--acc)}
.years{display:flex;gap:6px;flex-wrap:wrap}
.years button{background:transparent;border:1px solid var(--line);color:var(--dim);padding:7px 13px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.years button:hover{color:var(--ink);border-color:var(--dim)}
.years button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.count{color:var(--dim);font-size:13px;margin-left:auto}
main{max-width:1500px;margin:0 auto;padding:8px 24px 80px}
.yr{font-family:Fraunces,Georgia,serif;font-size:44px;margin:40px 0 16px;display:flex;align-items:baseline;gap:14px}
.yr small{font:13px "JetBrains Mono",monospace;color:var(--dim)}
.grid{columns:5 240px;column-gap:16px}
.card{color:inherit;text-decoration:none;break-inside:avoid;margin:0 0 16px;display:block;cursor:pointer;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:transform .2s,border-color .2s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--acc2);outline:none}
.card img{display:block;width:100%;height:auto;background:#1e1924}
.cap{padding:9px 11px 11px}
.cap time{color:var(--acc);font-size:12px;font-weight:600}
.cap p{margin:2px 0 0;font-size:12.5px;color:var(--ink);line-height:1.35}
.tag{display:inline-block;font-size:10.5px;color:var(--acc2);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.empty{color:var(--dim);padding:60px 0;text-align:center}
#lb{position:fixed;inset:0;z-index:50;background:rgba(6,5,8,.94);display:none;flex-direction:column}
#lb.open{display:flex}
#lb .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:16px 64px 0}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 20px 80px #000}
#lb .info{padding:14px 24px 20px;text-align:center}
#lb .info time{color:var(--acc);font-weight:600}
#lb .info p{margin:4px auto 0;max-width:900px}
#lb .info a{color:var(--dim);font-size:12px}
#lb button{position:absolute;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer}
#lb button:hover{background:var(--acc);color:#111}
#lb .x{top:16px;right:16px}#lb .pv{left:12px;top:50%}#lb .nx{right:12px;top:50%}
footer{color:var(--dim);text-align:center;font-size:12px;padding:0 24px 40px}
@media (max-width:600px){header{padding-top:36px}.grid{columns:2 150px;column-gap:10px}.card{margin-bottom:10px}#lb .stage{padding:56px 8px 0}#lb .pv,#lb .nx{top:auto;bottom:14px}.count{width:100%;margin:0}}
</style>

function render(){
  const q=$("#q").value.trim().toLowerCase();
  view=DATA.filter(d=>(year==="all"||d.d.startsWith(year))&&(!q||(d.t+" "+d.d+" "+d.g+" "+fmt(d.d)).toLowerCase().includes(q)));
  $("#count").textContent=`${view.length} flyer${view.length===1?"":"s"}`;
  if(!view.length){$("#main").innerHTML='<p class="empty">Nothing matches that search.</p>';return}
  const groups={};view.forEach((d,i)=>{const y=d.d.slice(0,4)||"Undated";(groups[y]=groups[y]||[]).push([d,i])});
  $("#main").innerHTML=Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([y,arr])=>
    `<h2 class="yr">${y}<small>${arr.length}</small></h2><div class="grid">`+arr.map(([d,i])=>
      `<a class="card" href="images/${d.s}.webp" data-i="${i}"><img src="thumbs/${d.s}.webp" width="${d.w}" height="${d.h}" loading="lazy" decoding="async" alt="Flyer: ${esc(d.t)}${d.d?", "+d.d:""}"><div class="cap"><time>${fmt(d.d)}</time>${d.g?`<span class="tag">${esc(d.g)}</span>`:""}<p>${esc(d.t)}</p></div></a>`).join("")+`</div>`).join("");
}
let cur=0;const lb=$("#lb");
function show(i){cur=(i+view.length)%view.length;const d=view[cur];$("#lbimg").src=`images/${d.s}.webp`;$("#lbimg").alt=d.t;$("#lbd").textContent=fmt(d.d)+(d.g?` · ${d.g}`:"");$("#lbt").textContent=d.t;$("#lba").href=`images/${d.s}.webp`;
  [cur-1,cur+1].forEach(j=>{const n=view[(j+view.length)%view.length];new Image().src=`images/${n.s}.webp`});history.replaceState(null,"","#"+d.s)}
function open(i){show(i);lb.classList.add("open");document.body.style.overflow="hidden"}
function close(){lb.classList.remove("open");document.body.style.overflow="";history.replaceState(null,"",location.pathname+location.search)}
$("#main").onclick=e=>{const c=e.target.closest(".card");if(!c)return;e.preventDefault();open(+c.dataset.i)};
lb.querySelector(".x").onclick=close;lb.querySelector(".pv").onclick=()=>show(cur-1);lb.querySelector(".nx").onclick=()=>show(cur+1);
lb.onclick=e=>{if(e.target===lb||e.target.classList.contains("stage"))close()};
addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});
let tx=0;lb.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});lb.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1))});
render();
if(location.hash){const i=view.findIndex(d=>d.s===location.hash.slice(1));if(i>=0)open(i)}
</script>
</body>
</html>
