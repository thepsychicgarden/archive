<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Psychic Garden — Flyer Archive</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="An archive of show and event flyers from The Psychic Garden.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400&family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#100a1c;--ink:#fbf6ff;--dim:#a99cc8;--acc:#fdc91e;--acc2:#a678ff;--violet:#3b0090;--line:#2e1d55}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "JetBrains Mono",ui-monospace,monospace;}
header{padding:48px 24px 32px;max-width:1500px;margin:0 auto}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(14px,2.4vw,26px)}
.logo{width:clamp(110px,16vw,200px);height:auto;flex:none;filter:drop-shadow(0 10px 30px rgba(252,196,25,.18))}
h1{font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;font-weight:400;font-size:clamp(34px,6vw,76px);line-height:1.05;margin:0;letter-spacing:-.01em;color:#fff}
.intro{max-width:860px;margin:18px auto 0;color:#cfc6dc;font-size:14px;line-height:1.7}
.intro p{margin:0 0 10px}
.intro a{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
.intro a:hover{color:#fff}
@media (max-width:860px){.dbr{display:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sub{color:var(--acc2);margin:0;letter-spacing:.08em;font-size:11px}
.bar{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1500px;margin:0 auto;padding:12px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 240px;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:999px;font:inherit;outline:none}
input[type=search]:focus{border-color:var(--acc)}
.years{display:flex;gap:6px;flex-wrap:wrap}
.years button{background:transparent;border:1px solid var(--line);color:var(--dim);padding:7px 13px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.years button:hover{color:var(--ink);border-color:var(--dim)}
.years button.on{background:var(--acc);color:var(--violet);border-color:var(--acc);font-weight:600}
.count{color:var(--dim);font-size:13px;margin-left:auto}
main{max-width:1500px;margin:0 auto;padding:8px 24px 80px}
.yr{font-family:Cinzel,Georgia,serif;font-weight:700;color:var(--acc);font-size:42px;margin:40px 0 16px;display:flex;align-items:baseline;gap:14px}
.yr small{font:13px "JetBrains Mono",monospace;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{color:inherit;text-decoration:none;display:flex;flex-direction:column;cursor:pointer;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:transform .2s,border-color .2s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--acc2);outline:none}
.frame{aspect-ratio:4/5;background:#08050e;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card img{display:block;width:100%;height:100%;object-fit:contain}
.cap{padding:9px 11px 11px}
.cap time{color:var(--acc);font-size:12px;font-weight:600}
.cap p{margin:2px 0 0;font-size:12.5px;color:var(--ink);line-height:1.35}
.tag{display:inline-block;font-size:10.5px;color:var(--acc2);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.empty{color:var(--dim);padding:60px 0;text-align:center}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.95);display:none;flex-direction:column}
#lb.open{display:flex}
#lb .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:16px 64px 0}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 20px 80px #000}
#lb .info{padding:14px 24px 20px;text-align:center}
#lb .info time{color:var(--acc);font-weight:600}
#lb .info p{margin:4px auto 0;max-width:900px}
#lb .info a{color:var(--dim);font-size:12px}
#lb button{position:absolute;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer}
#lb button:hover{background:var(--acc);color:var(--violet)}
#lb .x{top:16px;right:16px}#lb .pv{left:12px;top:50%}#lb .nx{right:12px;top:50%}
footer{color:var(--dim);text-align:center;font-size:12px;padding:24px 24px 48px;border-top:1px solid var(--line)}
footer .sub{margin:0}
footer .hint{margin:0}
@media (max-width:600px){header{padding-top:32px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}#lb .stage{padding:56px 8px 0}#lb .pv,#lb .nx{top:auto;bottom:14px}.count{width:100%;margin:0}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="logo" src="logo.png" width="794" height="693" alt="The Psychic Garden logo: a pyramid with an eye">
    <div>
      <h1>The Psychic Garden</h1>
      <div class="intro">
        <p>The Psychic Garden was a DIY space in Western New York from 2023 to 2026.<br class="dbr"> This page serves as an archive of all of the flyers for events hosted at the space.</p>
        <p>An archive of show recordings can be found <a href="https://www.youtube.com/@ThePsychicGarden" target="_blank" rel="noopener">here</a>.</p>
      </div>
    </div>
  </div>
</header>
<div class="bar"><div class="bar-in">
  <input type="search" id="q" placeholder="Search bands, events, dates…" aria-label="Search flyers">
  <div class="years" id="years"></div>
  <span class="count" id="count"></span>
</div></div>
<main id="main"></main>
<footer><p class="sub">the psychic garden was not a cult</p></footer>
<div id="lb" role="dialog" aria-modal="true" aria-label="Flyer viewer">
  <div class="stage"><img id="lbimg" alt=""></div>
  <div class="info"><time id="lbd"></time><p id="lbt"></p><a id="lba" target="_blank" rel="noopener">Open full size ↗</a></div>
  <button class="x" aria-label="Close">×</button>
  <button class="pv" aria-label="Previous">‹</button>
  <button class="nx" aria-label="Next">›</button>
</div>
<script>
const DATA=__DATA__;
const $=s=>document.querySelector(s);
const fmt=d=>{if(!d)return"";const[y,m,dd]=d.split("-").map(Number);return new Date(y,m-1,dd).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"})};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let year="all",view=[];
const yrs=[...new Set(DATA.map(d=>d.d.slice(0,4)).filter(Boolean))].sort().reverse();
$("#years").innerHTML=['all',...yrs].map(y=>`<button data-y="${y}" class="${y==='all'?'on':''}">${y==='all'?'All':y}</button>`).join("");
$("#years").onclick=e=>{const b=e.target.closest("button");if(!b)return;year=b.dataset.y;document.querySelectorAll("#years button").forEach(x=>x.classList.toggle("on",x===b));render();scrollTo({top:0})};
$("#q").oninput=render;
function render(){
  const q=$("#q").value.trim().toLowerCase();
  view=DATA.filter(d=>(year==="all"||d.d.startsWith(year))&&(!q||(d.t+" "+d.d+" "+d.g+" "+fmt(d.d)).toLowerCase().includes(q)));
  $("#count").textContent=`${view.length} flyer${view.length===1?"":"s"}`;
  if(!view.length){$("#main").innerHTML='<p class="empty">Nothing matches that search.</p>';return}
  const groups={};view.forEach((d,i)=>{const y=d.d.slice(0,4)||"Undated";(groups[y]=groups[y]||[]).push([d,i])});
  $("#main").innerHTML=Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([y,arr])=>
    `<h2 class="yr">${y}<small>${arr.length}</small></h2><div class="grid">`+arr.map(([d,i])=>
      `<a class="card" href="images/${d.s}.webp" data-i="${i}"><div class="frame"><img src="thumbs/${d.s}.webp" width="${d.w}" height="${d.h}" loading="lazy" decoding="async" alt="Flyer: ${esc(d.t)}${d.d?", "+d.d:""}"></div><div class="cap"><time>${fmt(d.d)}</time>${d.g?`<span class="tag">${esc(d.g)}</span>`:""}<p>${esc(d.t)}</p></div></a>`).join("")+`</div>`).join("");
}
let cur=0;const lb=$("#lb");
function show(i){cur=(i+view.length)%view.length;const d=view[cur];$("#lbimg").src=`images/${d.s}.webp`;$("#lbimg").alt=d.t;$("#lbd").textContent=fmt(d.d)+(d.g?` · ${d.g}`:"");$("#lbt").textContent=d.t;$("#lba").href=`images/${d.s}.webp`;
  [cur-1,cur+1].forEach(j=>{const n=view[(j+view.length)%view.length];new Image().src=`images/${n.s}.webp`});history.replaceState(null,"","#"+d.s)}
function open(i){show(i);lb.classList.add("open");document.body.style.overflow="hidden"}
function close(){lb.classList.remove("open");document.body.style.overflow="";history.replaceState(null,"",location.pathname+location.search)}
$("#main").onclick=e=>{const c=e.target.closest(".card");if(!c)return;e.preventDefault();open(+c.dataset.i)};
lb.querySelector(".x").onclick=close;lb.querySelector(".pv").onclick=()=>show(cur-1);lb.querySelector(".nx").onclick=()=>show(cur+1);
lb.onclick=e=>{if(e.target===lb||e.target.classList.contains("stage"))close()};
addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});
let tx=0;lb.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});lb.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1))});
render();
if(location.hash){const i=view.findIndex(d=>d.s===location.hash.slice(1));if(i>=0)open(i)}
</script>
</body>
</html>
